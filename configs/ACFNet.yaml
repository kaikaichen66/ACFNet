# ACFNet: SCMB + ACF + SCE

# Parameters
nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_SCMB, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_SCMB, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_SCMB, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_SCMB, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head
head:
  # ACF
  - [-1, 1, Conv, [512, 1, 1]] # 11
  - [6, 1, Conv, [512, 3, 2]] # 12
  - [[-1, 11], 1, Concat, [1]] # 13
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15
  - [4, 1, Conv, [256, 3, 2]] # 16
  - [[15, -1, 6], 1, Concat, [1]] # 17
  - [-1, 2, C3k2, [512, False]] # 18

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 19
  - [[-1, 4], 1, Concat, [1]] # 20
  - [-1, 2, C3k2, [256, False]] # 21
  - [-1, 1, SCE, []] # 22

  - [21, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 18], 1, Concat, [1]] # 24
  - [-1, 2, C3k2, [512, False]] # 25
  - [-1, 1, SCE, []] # 26

  - [18, 1, Conv, [256, 3, 2]] # 27
  - [25, 1, Conv, [256, 3, 2]] # 28
  - [[14, 27, -1], 1, Concat, [1]] # 29
  - [-1, 2, C3k2, [1024, True]] # 30
  - [-1, 1, SCE, []] # 31

  # Detection
  - [[22, 26, 31], 1, Detect, [nc]]